# Working papers, newest first. Each entry appears on the home page and the Research page.
- title: "International trade and cyber-readiness: A review of micro, small and medium-sized enterprise (MSME) perception and practice"
  year: 2026
  coauthors: "Kathryn Lundquist, Rahul Jha and Chi Pok Cheang"
  series: "WTO Staff Working Paper ERSD-2026-05"
  url: "https://www.wto.org/english/res_e/reser_e/ersd202605_e.htm"
  summary: "We define cyber-readiness, report a 2023 survey of businesses and policymakers who had engaged with the International Telecommunication Union, and build a cyber-readiness score. The score shows no correlation with international trade by MSMEs or large firms, but a positive correlation with MSME productivity. The paper grew out of my work in the WTO's Economic Research and Statistics Division."
  jel: "F14, L25, M21, O33"
